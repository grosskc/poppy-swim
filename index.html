<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root {
  --ink:#0C1B2E; --ink-soft:#24364A; --paper:#E8EEF2; --card:#FFFFFF; --line:#D7E0E7;
  --muted:#5A6B7C; --quiet:#7A8A99; --text:#152032; --aqua:#0C7C7C; --aqua-deep:#0A5E5E;
  --warn:#8A4B12; --warn-bg:#F8EEDF; --ok:#176B3A; --ok-bg:#E7F6EC; --radius:14px;
  --sans:Manrope,"Segoe UI",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(16,42,67,.05),0 6px 18px rgba(16,42,67,.05);
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:var(--paper); color:var(--text); font-family:var(--sans); min-height:100%; }
button,input,select { font:inherit; }
.wrap { max-width:1120px; margin:0 auto; padding:0 40px 48px; }
header.hero { background:linear-gradient(180deg,#0C1B2E 0%,#102A43 100%); color:#F4F7FA; padding:16px 40px 14px; position:sticky; top:0; z-index:20; }
.hero-inner { max-width:1120px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; }
.name-block h1 { font-weight:800; font-size:20px; letter-spacing:-.02em; line-height:1.2; }
.meta { margin-top:3px; color:#C5D2DE; font-size:12.5px; font-weight:500; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; }
.dot { width:3px; height:3px; border-radius:50%; background:#7F93A6; display:inline-block; }
.chip { display:inline-flex; align-items:center; gap:5px; background:rgba(46,168,120,.18); border:1px solid rgba(120,210,170,.28); color:#C8F0DC; border-radius:999px; padding:1px 8px; font-size:11px; font-weight:700; }
.chip i { width:6px; height:6px; border-radius:50%; background:#3DDC97; display:inline-block; }
.hero-actions { display:flex; align-items:center; gap:10px; flex:1 1 auto; flex-wrap:wrap; justify-content:flex-end; min-width:0; }
.toggle { display:inline-flex; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:3px; gap:2px; flex:0 0 auto; }
.toggle button { appearance:none; border:0; background:transparent; color:#C5D2DE; font:700 12.5px/1 var(--sans); padding:7px 14px; border-radius:999px; cursor:pointer; letter-spacing:.04em; white-space:nowrap; flex:1 0 auto; }
.toggle button[aria-pressed="true"] { background:#F4F7FA; color:var(--ink); }
.btn-quiet { color:#C5D2DE; font:600 12.5px/1 var(--sans); background:transparent; border:0; cursor:pointer; padding:6px 2px; white-space:nowrap; flex:0 0 auto; }
.status { background:#F3E6C8; border-bottom:1px solid #E6D2A8; color:#6A4A12; font-size:12.5px; font-weight:600; }
.status .inner { max-width:1120px; margin:0 auto; padding:8px 40px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:baseline; }
.status .fresh { color:#5A6B7C; font-weight:500; }
.cards { display:grid; grid-template-columns:1.25fr 1fr 1fr; gap:12px; margin:18px 0 22px; }
.card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; border:1px solid rgba(16,42,67,.04); }
.card h2 { font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.card h2 .when { letter-spacing:0; text-transform:none; font-weight:700; color:var(--ink-soft); font-size:12px; }
.card.soon { border:1px solid #C6E4E2; background:linear-gradient(180deg,#FFFFFF,#EAF7F6); }
.lead { font-size:14.5px; font-weight:800; color:var(--ink); letter-spacing:-.01em; margin-bottom:8px; line-height:1.3; }
.slist { list-style:none; display:flex; flex-direction:column; gap:5px; }
.slist li { display:grid; grid-template-columns:92px 1fr; gap:8px; font-size:13px; align-items:baseline; }
.slist .ev { font-weight:800; color:var(--ink); }
.slist .why { color:var(--ink-soft); font-weight:600; }
.whisper { margin-top:8px; font-size:11.5px; color:var(--quiet); font-weight:500; line-height:1.4; }
.card p { font-size:12.5px; color:var(--ink-soft); font-weight:500; line-height:1.4; }
.qual { display:flex; flex-direction:column; gap:8px; }
.qualrow { display:flex; gap:8px; align-items:flex-start; font-size:13px; line-height:1.35; }
.mark { flex:0 0 auto; margin-top:1px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; }
.mark.ok { background:var(--ok-bg); color:var(--ok); }
.mark.partial { background:#F8E7B0; color:#8A5A00; }
.qualrow .k { font-weight:800; color:var(--ink); }
.qualrow .v { color:var(--ink-soft); font-weight:600; }
.section-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:6px 2px 10px; }
.section-head h2 { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin:0; }
.section-head .hint { font-size:12px; color:var(--muted); font-weight:500; }
.stroke { margin-bottom:14px; }
.stroke-head { display:flex; align-items:center; gap:8px; margin:0 2px 6px; }
.swatch { width:8px; height:8px; border-radius:2px; }
.stroke-head h3 { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin:0; }
.stroke-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid rgba(16,42,67,.04); overflow:hidden; border-left:4px solid var(--stroke); }
.event { padding:11px 16px 10px; border-top:1px solid var(--line); display:grid; grid-template-columns:132px 140px 1fr 168px; grid-template-areas:"name time mid gap" "meta meta mid gap" "last last last last" "ranks ranks ranks ranks"; gap:2px 16px; align-items:start; }
.event:first-child { border-top:0; }
.event.stale { background:#FBF8F2; }
.event.empty { opacity:.8; background:#F8FAFB; }
.ev-name { grid-area:name; font-weight:800; font-size:14.5px; color:var(--ink); letter-spacing:-.01em; padding-top:4px; }
.time-col { grid-area:time; }
.time { font-weight:800; font-size:26px; letter-spacing:-.03em; color:var(--ink); font-variant-numeric:tabular-nums lining-nums; line-height:1; text-align:right; width:100%; }
.time.none { font-size:18px; font-weight:700; color:var(--quiet); }
.time-col .badges { display:flex; justify-content:flex-end; gap:6px; margin-top:5px; flex-wrap:wrap; }
.badge { display:inline-flex; align-items:center; justify-content:center; min-width:36px; height:18px; padding:0 6px; border-radius:999px; font-size:10px; font-weight:800; letter-spacing:.05em; }
.badge.B { background:#D7DEE5; color:#3A4A5A; }
.badge.BB { background:#E3EEF9; color:#1D4E89; }
.badge.A { background:#D8F1EC; color:#0A5E5E; }
.badge.AA { background:#D8F3E4; color:#176B3A; }
.badge.AAA { background:#F8E7B0; color:#8A5A00; }
.badge.AAAA { background:#EDE4FA; color:#5B2D91; }
.unofficial { display:inline-flex; align-items:center; padding:1px 7px; border-radius:999px; border:1.5px dotted #8A6D3B; color:#8A6D3B; background:transparent; font-size:9.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; cursor:help; }
.gap { grid-area:gap; text-align:right; padding-top:4px; }
.gap .need { font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.gap .amt { font-size:16px; font-weight:800; letter-spacing:-.02em; color:var(--ink); font-variant-numeric:tabular-nums lining-nums; margin-top:1px; }
.gap.close .amt { color:var(--aqua-deep); }
.gap .to { display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-top:1px; }
.mid { grid-area:mid; display:flex; flex-wrap:wrap; gap:5px; align-content:flex-start; padding-top:5px; }
.tag { display:inline-flex; align-items:center; gap:4px; border-radius:6px; padding:2px 7px; font-size:10.5px; font-weight:750; }
.tag.ok { background:var(--ok-bg); color:var(--ok); }
.tag.warn { background:var(--warn-bg); color:var(--warn); }
.tag.gold { background:#F8E7B0; color:#8A5A00; }
.tag.quiet { background:#F3F6F8; color:var(--muted); }
.emeta { grid-area:meta; font-size:11.5px; font-weight:600; color:var(--quiet); padding-top:2px; line-height:1.45; }
.emeta strong { color:var(--warn); font-weight:800; }
.also { color:var(--muted); font-weight:600; }
.last { grid-area:last; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-top:4px; font-variant-numeric:tabular-nums; }
.last .off { color:var(--warn); font-weight:800; }
.last .best { color:var(--ok); font-weight:800; }
.ranks { grid-area:ranks; display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.rank { display:inline-flex; align-items:baseline; gap:4px; background:#F3F6F8; border-radius:999px; padding:2px 8px 2px 7px; font-size:11px; }
.rank.hot { background:#E7F6EC; }
.rank .k { font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-size:9.5px; }
.rank .v { font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
.rank.hot .v { color:var(--ok); }
.rank .of { font-weight:600; color:var(--quiet); font-size:10.5px; }
.ranks-wrap { grid-area:ranks; margin-top:6px; }
.ranks-wrap .ranks { margin-top:0; }
.rank-cap { display:block; font-size:10.5px; font-weight:650; color:var(--quiet); margin-bottom:4px; letter-spacing:.01em; }
.rank-prov { display:inline-flex; flex-wrap:wrap; align-items:baseline; gap:0 5px; margin-top:6px; padding:3px 9px; border-radius:999px; border:1.5px dotted #8A6D3B; color:#6E572F; background:#FBF8F2; font-size:11px; font-weight:650; font-variant-numeric:tabular-nums; line-height:1.35; max-width:100%; }
.rank-prov strong { font-weight:800; color:#8A6D3B; }
.honor { padding:8px 16px 10px; font-size:12px; color:var(--ink-soft); font-weight:600; border-top:1px dashed var(--line); background:#FAFBFC; }
.honor strong { color:var(--ink); font-variant-numeric:tabular-nums; }
.notes { margin-top:16px; color:var(--muted); font-size:12px; line-height:1.55; }
.notes a { color:var(--aqua-deep); font-weight:700; }
.notes strong { color:var(--ink-soft); font-weight:700; }
.toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600; z-index:40; max-width:min(520px,92vw); box-shadow:var(--shadow); display:none; }
.toast.show { display:block; }
.modal-bg { position:fixed; inset:0; background:rgba(12,27,46,.45); z-index:30; display:none; align-items:flex-end; justify-content:center; padding:16px; }
.modal-bg.show { display:flex; }
.modal { background:#fff; border-radius:16px; padding:18px 18px 16px; width:min(440px,100%); box-shadow:var(--shadow); }
.modal h3 { font-size:16px; font-weight:800; color:var(--ink); margin-bottom:8px; }
.modal p { font-size:13px; color:var(--ink-soft); line-height:1.45; margin-bottom:12px; }
.modal label { display:block; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:8px 0 4px; }
.modal input,.modal select { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px; }
.modal .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.modal .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
.modal .actions button { border:0; border-radius:999px; padding:8px 14px; font-weight:700; cursor:pointer; }
.modal .actions .cancel { background:#F3F6F8; color:var(--ink-soft); }
.modal .actions .go { background:var(--ink); color:#fff; }
.file-hint { font-size:12px; color:var(--quiet); margin-top:8px; }

.view-toggle { margin-right:4px; }
.deadlines { display:flex; flex-direction:column; gap:8px; margin:18px 0 18px; }
.deadlines-head { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin:0 2px 2px; }
.deadline { background:var(--card); border:1px solid rgba(16,42,67,.04); border-left:4px solid var(--warn); border-radius:12px; box-shadow:var(--shadow); padding:10px 14px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
.deadline.soft { border-left-color:#C5D2DE; }
.deadline.muted { border-left-color:var(--line); }
.deadline .dl-when { font-weight:800; color:var(--ink); font-size:14px; letter-spacing:-.02em; }
.deadline .dl-meet { font-size:13px; font-weight:600; color:var(--ink-soft); }
.deadline .dl-status { font-size:12.5px; font-weight:700; color:var(--warn); }
.deadline.muted .dl-status { color:var(--muted); }
.deadline .dl-until { font-size:11.5px; font-weight:700; color:var(--quiet); }
.meet-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px 14px; border:1px solid rgba(16,42,67,.04); margin-bottom:12px; }
.meet-card.current { border:1px solid #C6E4E2; background:linear-gradient(180deg,#FFFFFF,#EAF7F6); }
.meet-card.ineligible { opacity:.92; }
.meet-card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
.meet-card h2 { font-size:18px; font-weight:800; letter-spacing:-.02em; text-transform:none; color:var(--ink); margin:0; line-height:1.25; }
.meet-official { display:block; font-size:12px; font-weight:600; color:var(--muted); letter-spacing:0; text-transform:none; margin-top:2px; }
.meet-dates { font-size:13.5px; font-weight:800; color:var(--ink-soft); }
.meet-badge { display:inline-flex; align-items:center; border-radius:999px; padding:2px 8px; font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; margin-left:8px; vertical-align:middle; }
.meet-badge.now { background:#E7F6EC; color:var(--ok); }
.meet-badge.warn { background:var(--warn-bg); color:var(--warn); }
.meet-badge.quiet { background:#F3F6F8; color:var(--muted); }
.meet-flags { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
.meet-flags .meet-badge { text-transform:none; letter-spacing:0; font-size:11px; padding:3px 8px; }
.meet-grid { display:grid; grid-template-columns:148px 1fr; gap:7px 16px; font-size:13px; line-height:1.45; }
.meet-grid .k { font-weight:800; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding-top:2px; }
.meet-grid .v { font-weight:600; color:var(--ink-soft); }
.meet-grid .v strong { color:var(--ink); font-weight:800; }
.meet-grid a { color:var(--aqua-deep); font-weight:700; text-decoration:none; }
.meet-grid a:hover { text-decoration:underline; }
.meet-events { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:2px; }
.meet-events li { display:flex; gap:10px; flex-wrap:wrap; }
.meet-events .num { font-weight:800; color:var(--quiet); width:2.4em; font-variant-numeric:tabular-nums; }
.meet-events .ev { font-weight:800; color:var(--ink); min-width:7em; }
.meet-events .seed { color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums; }
.meet-events li.pick { background:#EAF7F6; border-radius:6px; padding:1px 6px; margin-left:-6px; }
.suggested { margin-top:6px; }
.suggested .lead { font-size:13px; font-weight:800; color:var(--ink); margin-bottom:4px; }
.suggested ul { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:4px; }
.suggested li { display:grid; grid-template-columns:92px 1fr; gap:8px; font-size:13px; }
.suggested .ev { font-weight:800; color:var(--ink); }
.suggested .why { color:var(--ink-soft); font-weight:600; }
.meet-links { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.meet-links a { display:inline-flex; align-items:center; background:#F3F6F8; color:var(--aqua-deep); font-size:12px; font-weight:700; padding:6px 10px; border-radius:999px; text-decoration:none; }
.meet-links a:hover { background:#E7EEF2; }
.meet-note { margin-top:8px; font-size:12px; color:var(--muted); font-weight:500; line-height:1.45; }
.past-meets { margin:18px 0 8px; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid rgba(16,42,67,.04); padding:4px 16px 8px; }
.past-meets > summary { cursor:pointer; list-style:none; font-size:13px; font-weight:800; color:var(--ink); padding:10px 0; display:flex; justify-content:space-between; align-items:center; }
.past-meets > summary::-webkit-details-marker { display:none; }
.past-meets > summary::after { content:"Show"; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--aqua-deep); }
.past-meets[open] > summary::after { content:"Hide"; }
.past-meets .meet-card { box-shadow:none; border:1px solid var(--line); }
.meets-foot { margin:16px 2px 0; color:var(--muted); font-size:12px; line-height:1.55; }
.meets-foot a { color:var(--aqua-deep); font-weight:700; }

@media (max-width:700px) {
  header.hero, .status .inner, .wrap { padding-left:14px; padding-right:14px; }
  header.hero { padding-top:14px; padding-bottom:12px; }
  .hero-inner { flex-direction:column; align-items:stretch; gap:10px; }
  .hero-actions { justify-content:flex-start; width:100%; }
  .view-toggle { flex:1 1 100%; margin-right:0; }
  .view-toggle button { flex:1 0 auto; text-align:center; }
  #course-toggle { flex:0 1 auto; }
  #course-toggle button { flex:1 0 auto; text-align:center; }
  .name-block h1 { font-size:18px; }
  .status .inner { flex-direction:column; gap:2px; }
  .cards { grid-template-columns:1fr; }
  .section-head { flex-direction:column; gap:4px; }
  .event { grid-template-columns:1fr auto; grid-template-areas:"name gap" "time gap" "mid mid" "meta meta" "last last" "ranks ranks"; gap:3px 10px; }
  .time { text-align:left; font-size:28px; }
  .time-col .badges { justify-content:flex-start; }
  .ev-name { padding-top:0; }
  .meet-grid { grid-template-columns:1fr; gap:2px 0; }

.ehls { margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); }
.ehls-head { display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
.ehls h3 { margin:0; font-size:13px; font-weight:800; letter-spacing:.04em; text-transform:none; color:var(--ink); }
.ehls .hint { font-size:12px; font-weight:600; color:var(--warn); max-width:36em; line-height:1.4; margin:6px 0 0; }
.ehls-print-btn {
  appearance:none; border:0; background:var(--ink); color:#fff;
  font:800 12.5px/1 var(--sans); letter-spacing:.03em;
  padding:9px 14px; border-radius:999px; cursor:pointer; white-space:nowrap;
}
.ehls-print-btn:hover { background:#18314A; }
table.ehls-table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; margin-top:8px; }
table.ehls-table th {
  text-align:left; font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); padding:6px 8px; border-bottom:2px solid var(--ink);
}
table.ehls-table td { padding:8px; border-bottom:1px solid var(--line); font-size:13px; font-weight:600; color:var(--ink-soft); vertical-align:middle; }
table.ehls-table tr:last-child td { border-bottom:0; }
table.ehls-table .ev { font-weight:800; color:var(--ink); }
table.ehls-table .tba { color:var(--warn); font-weight:800; letter-spacing:.04em; font-size:12px; }
table.ehls-table .write { width:4.2em; }
table.ehls-table .blank, .ehls-card .blank { display:block; height:22px; border-bottom:1.5px solid #C5D2DE; min-width:3.6em; }
.ehls-day, table.ehls-table .ehls-day td {
  font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--aqua-deep);
  background:#EAF7F6; border-bottom:0;
}
.ehls-cards { display:none; }
.ehls-card { border-top:1px solid var(--line); padding:10px 0 8px; }
.ehls-card:first-of-type { border-top:0; }

const STROKE_HY3 = {A:"Free",B:"Back",C:"Breast",D:"Fly",E:"IM"};
const STROKE_CL2 = {1:"Free",2:"Back",3:"Breast",4:"Fly",5:"IM"};
const TARGET_LAST = "Gawelek-Gross";
const TARGET_FIRST = "Poppy";

function fmtSec(sec){
  if(sec==null || !(sec>0)) return null;
  sec = Math.round((sec+1e-9)*100)/100;
  if(sec<60) return sec.toFixed(2);
  const m=Math.floor(sec/60);
  const r=sec-m*60;
  return m+":"+r.toFixed(2).padStart(5,"0");
}
function toSec(t){
  if(t==null||t==="") return Infinity;
  const p=String(t).split(":");
  if(p.length===1) return parseFloat(p[0]);
  if(p.length===2) return parseInt(p[0],10)*60+parseFloat(p[1]);
  return parseInt(p[0],10)*3600+parseInt(p[1],10)*60+parseFloat(p[2]);
}
function normTime(t){ const s=toSec(t); return Number.isFinite(s)?fmtSec(s):null; }
function parseHy3TimeToken(s){
  if(!s) return null;
  s=String(s).trim().replace(/[YLS]/g,"");
  if(!s||s==="0.00") return null;
  const v=parseFloat(s);
  return v>0?v:null;
}
function parseMmddyyyy(s){
  const d=String(s).replace(/\D/g,"").slice(0,8);
  if(d.length!==8) return null;
  return d.slice(4,8)+"-"+d.slice(0,2)+"-"+d.slice(2,4);
}
function parseSplits(g1){
  if(!g1) return [];
  const parts=[...g1.slice(3).matchAll(/(\d+)\s+(\d+\.\d+|\d+:\d+\.\d+)/g)];
  return parts.map(([_,code,t])=>({at:parseInt(code,10)*25, time: t.includes(":")?t:fmtSec(parseFloat(t))}));
}
function parseHy3(text){
  const lines=text.split(/\r?\n/);
  let meet="Unknown meet", courseDefault="SCY";
  for(const ln of lines){
    if(ln.startsWith("B1")) meet=(ln.slice(2,45).trim()||meet);
    if(ln.startsWith("B2") && /Y/.test(ln)) courseDefault="SCY";
  }
  const out=[];
  let athlete=false, cur=null;
  const flush=()=>{ if(cur && cur.time && !cur.dq) out.push(cur); cur=null; };
  for(const ln of lines){
    const typ=ln.slice(0,2);
    if(typ==="D1"){
      flush();
      const last=(ln.slice(8,28)||"").trim();
      const first=(ln.slice(28,48)||"").trim();
      athlete=last.includes("Gawelek") && first.includes("Poppy");
      continue;
    }
    if(typ==="C1"){ flush(); athlete=false; continue; }
    if(!athlete) continue;
    if(typ==="E1"){
      flush();
      const dist=ln.slice(17,21).trim();
      const stroke=ln.charAt(21);
      const ch=ln.charAt(31);
      const course={S:"SCY",Y:"SCY",L:"LCM",M:"SCM"}[ch]||courseDefault;
      const ev=dist+" "+(STROKE_HY3[stroke]||stroke);
      cur={event:ev, course, meet};
    } else if(typ==="E2" && cur){
      const m=ln.match(/^E2.\s*([0-9.]+)/);
      const final=parseHy3TimeToken(m&&m[1]);
      const dm=ln.match(/(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])(20\d{2})/);
      const date=dm?parseMmddyyyy(dm[0]):null;
      const dq=/\b(DQ|NS|SCR|DFS)\b/.test(ln);
      cur.time=fmtSec(final); cur.date=date; cur.dq=dq; cur.splits=[];
    } else if(typ==="G1" && cur){
      cur.splits=parseSplits(ln);
    }
  }
  flush();
  return {meet, swims:out};
}
function parseCl2(text){
  const lines=text.split(/\r?\n/);
  let meet="Unknown meet", courseDefault="SCY";
  const out=[];
  for(const ln of lines){
    if(ln.startsWith("B1")){
      meet=(ln.slice(11,45).trim()||meet);
      if(ln.includes("LCM")||/\sL\s/.test(ln.slice(80))) courseDefault="LCM";
    }
    if(!ln.startsWith("D0") && !ln.startsWith("D01")) continue;
    if(!/Gawelek/i.test(ln) || !/Poppy/i.test(ln)) continue;
    // event code after age: e.g. 1005113, 504221, 2001311, 251101
    const evm=ln.match(/\d{2}F[A-Z]\s+(\d{2,3})([1-5])(\d{3})/);
    let event=null;
    if(evm) event=evm[1]+" "+(STROKE_CL2[evm[2]]||evm[2]);
    const times=[...ln.matchAll(/(\d{0,2}:?\d{1,2}\.\d{2})[YLS]/g)].map(m=>normTime(m[1]));
    const final=times.length?times[times.length-1]:null;
    const dm=ln.match(/(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])(20\d{2})/);
    const date=dm?parseMmddyyyy(dm[0]):null;
    const course=/L\d{0,1}\s*$/.test(final||"")?courseDefault: (ln.includes("LCM")?"LCM":"SCY");
    // course letter next to time
    let course2="SCY";
    const cm=ln.match(/\d{0,2}:?\d{1,2}\.\d{2}([YLS])/g);
    if(cm&&cm.length){
      const last=cm[cm.length-1].slice(-1);
      course2={Y:"SCY",L:"LCM",S:"SCM"}[last]||"SCY";
    }
    if(!event||!final||!date) continue;
    if(/\b(DQ|NS|SCR|DFS)\b/.test(ln)) continue;
    out.push({event, course:course2, time:final, date, meet, splits:[]});
  }
  return {meet, swims:out};
}
async function inflateRaw(bytes){
  if(typeof DecompressionStream!=="function") throw new Error("This browser can't unzip files. Open the zip and choose the .hy3 or .cl2 file instead.");
  const ds=new DecompressionStream("deflate-raw");
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
function latin1(bytes){ return new TextDecoder("latin1").decode(bytes); }
async function unzip(buf){
  const view=new DataView(buf);
  const files=[];
  let offset=0;
  while(offset+30<=view.byteLength){
    const sig=view.getUint32(offset,true);
    if(sig!==0x04034b50) break;
    const flag=view.getUint16(offset+6,true);
    const method=view.getUint16(offset+8,true);
    let compSize=view.getUint32(offset+18,true);
    let uncompSize=view.getUint32(offset+22,true);
    const nameLen=view.getUint16(offset+26,true);
    const extraLen=view.getUint16(offset+28,true);
    const name=latin1(new Uint8Array(buf,offset+30,nameLen));
    let dataStart=offset+30+nameLen+extraLen;
    if(flag&0x8){
      // data descriptor after data; scan for signature
      throw new Error("This zip uses a layout this page can't read. Unzip it and choose the .hy3 file.");
    }
    const data=new Uint8Array(buf,dataStart,compSize);
    let raw;
    if(method===0) raw=data;
    else if(method===8) raw=await inflateRaw(data);
    else throw new Error("Unsupported zip compression in "+name);
    files.push({name, data:raw});
    offset=dataStart+compSize;
  }
  if(!files.length) throw new Error("Couldn't find files inside that zip.");
  return files;
}
function displayMeetName(raw){
  if(!raw) return "Unknown meet";
  let s=raw.replace(/^20\d{2}\s+OH\s+/i,"").replace(/\s+Meet$/i,"").trim();
  if(/Payson/i.test(s)) return "Payson's Journey Memorial";
  if(/DR Intrasquad/i.test(s)) return "DR Intrasquad";
  return s||raw;
}
async function parseResultsFile(file){
  const buf=await file.arrayBuffer();
  const name=(file.name||"").toLowerCase();
  const items=[];
  if(name.endsWith(".zip") || (buf.byteLength>4 && new DataView(buf).getUint32(0,true)===0x04034b50)){
    const files=await unzip(buf);
    for(const f of files){
      const n=f.name.toLowerCase();
      if(n.endsWith(".hy3")||n.endsWith(".cl2")||n.endsWith(".sd3")){
        items.push({name:f.name, text:latin1(f.data)});
      }
    }
  } else {
    items.push({name:file.name, text:latin1(new Uint8Array(buf))});
  }
  const hy=items.filter(f=>/\.hy3$/i.test(f.name));
  const cl=items.filter(f=>/\.(cl2|sd3)$/i.test(f.name));
  let parsed=null;
  if(hy.length) parsed=parseHy3(hy[0].text);
  else if(cl.length) parsed=parseCl2(cl[0].text);
  else throw new Error("No .hy3 or .cl2 results file was found.");
  const swims=parsed.swims.map(s=>({
    event:s.event,
    course:s.course,
    time:s.time,
    date:s.date,
    meet:displayMeetName(s.meet||parsed.meet),
    source:"Ohio results file",
    splits:s.splits||[],
    provisional:false
  })).filter(s=>s.event&&s.time&&s.date);
  return {meet:displayMeetName(parsed.meet), swims};
}


const STORAGE_KEY="poppy-dashboard-v1";
const STD_ORDER=["B","BB","A","AA","AAA","AAAA"];
const STROKE_COLOR={Freestyle:"#0E8A9A",Backstroke:"#2B62B3",Breaststroke:"#C44B6A",Butterfly:"#6B4C9A","Individual Medley":"#C78B12"};

function courseKey(c){ return c==="LCM"?"lcm":"scy"; }
function opposite(c){ return c==="SCY"?"LCM":"SCY"; }
function fmtDrop(sec){ if(sec<60) return sec.toFixed(2)+"s"; const m=Math.floor(sec/60); const s=(sec%60).toFixed(2).padStart(5,"0"); return m+":"+s; }
function fmtRank(n){ return "#"+Number(n).toLocaleString("en-US"); }
function fmtOf(n){ return n?"of "+Number(n).toLocaleString("en-US"):""; }
function fmtDate(iso){
  if(!iso) return "";
  const [y,m,d]=iso.split("-").map(x=>parseInt(x,10));
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  if(!y||!m||!d) return iso;
  return months[m-1]+" "+d+", "+y;
}
function standardFor(course,event,time){
  const cuts=DATA.standards[courseKey(course)][event];
  if(!cuts) return {std:null,next:null};
  const t=toSec(time);
  let achieved=null;
  for(const s of STD_ORDER){ if(t<=toSec(cuts[s])) achieved=s; }
  if(achieved===null) return {std:null,next:"B"};
  if(achieved==="AAAA") return {std:"AAAA",next:null};
  return {std:achieved,next:STD_ORDER[STD_ORDER.indexOf(achieved)+1]};
}
function isInWindow(date){ return date>=DATA.meta.midStatesWindowStart; }
function swimKey(s){ return [s.event,s.course,s.date,normTime(s.time)].join("|"); }
function loadLocal(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")||{history:[],provisional:[],importedFiles:[]}; }
  catch(e){ return {history:[],provisional:[],importedFiles:[]}; }
}
function saveLocal(loc){ localStorage.setItem(STORAGE_KEY, JSON.stringify(loc)); }
function mergeState(){
  const loc=loadLocal();
  const snapH=DATA.swimHistory||[];
  const snapP=(DATA.provisionalTimes||[]).map(p=>({...p,provisional:true,source:p.source||"Provisional",splits:p.splits||[]}));
  const seen=new Set();
  const history=[];
  for(const s of [...snapH, ...(loc.history||[])]){
    const k=swimKey(s);
    if(!s.event||!s.time||!s.date||seen.has(k)) continue;
    seen.add(k);
    history.push({...s, time:normTime(s.time), provisional:!!s.provisional});
  }
  const officialDates=new Set(history.filter(s=>!s.provisional).map(s=>s.event+"|"+s.course+"|"+s.date));
  const provisional=[];
  for(const p of [...snapP, ...(loc.provisional||[])]){
    const id=p.event+"|"+p.course+"|"+p.date;
    if(officialDates.has(id)) continue;
    const k=swimKey(p);
    if(seen.has(k)) continue;
    seen.add(k);
    provisional.push({...p, time:normTime(p.time), provisional:true, source:p.source||"Provisional", splits:p.splits||[]});
  }
  return {history, provisional, local:loc};
}
function swimsForEvent(state,event,course){
  return [...state.history,...state.provisional].filter(s=>s.event===event&&s.course===course);
}
function bestOf(rows){
  return rows.reduce((b,s)=>{
    if(!b||toSec(s.time)<toSec(b.time)) return s;
    return b;
  },null);
}
function lastOf(rows){
  return rows.reduce((b,s)=>{
    if(!b) return s;
    if(s.date>b.date) return s;
    if(s.date===b.date && toSec(s.time)<toSec(b.time)) return s;
    return b;
  },null);
}
function windowBestOf(rows){
  return bestOf(rows.filter(s=>isInWindow(s.date)));
}
function ranksFor(best, officialTimes){
  const empty={ohio:null,centralZone:null,usa:null};
  if(!best) return {...empty};
  const row=(officialTimes||[]).find(t=>t.event===best.event&&t.course===best.course);
  const official=row&&row.ranks?row.ranks:empty;
  const match=row && row.time===best.time && row.date===best.date && !best.provisional;
  if(match) return {...official};
  // Keep official snapshot ranks when a newer unofficial (or unmatched) best is showing.
  // Never invent a new place.
  const fasterBy=row && Number.isFinite(toSec(row.time)) && Number.isFinite(toSec(best.time))
    ? toSec(row.time)-toSec(best.time)
    : null;
  return {
    ...official,
    snapshotTime:row?row.time:null,
    snapshotDate:row?row.date:null,
    pending:true,
    provisional:!!best.provisional,
    fasterBy:fasterBy!=null && fasterBy>0?fasterBy:null
  };
}
function buildBests(state,course){
  const catalog=DATA.eventCatalog[courseKey(course)];
  return catalog.map(def=>{
    const rows=swimsForEvent(state,def.name,course);
    const best=bestOf(rows);
    const last=lastOf(rows);
    const win=windowBestOf(rows);
    if(!best){
      return {event:def.name,stroke:def.stroke,course,time:"",date:"",meet:null,unofficial:false,ranks:{ohio:null,centralZone:null,usa:null},std:null,next:null,last:null,windowBest:null,count:0};
    }
    const stds=standardFor(course,def.name,best.time);
    return {
      event:def.name, stroke:def.stroke, course,
      time:best.time, date:best.date, meet:best.meet||null,
      unofficial:!!best.provisional,
      ranks:ranksFor(best, DATA.officialTimes),
      std:stds.std, next:stds.next,
      last, previous: last?previousOf(rows,last):null, windowBest:win, count:rows.length
    };
  });
}
function dropInfo(course,ev){
  if(!ev.time||!ev.next) return null;
  const cuts=DATA.standards[courseKey(course)][ev.event];
  if(!cuts) return null;
  return {drop:toSec(ev.time)-toSec(cuts[ev.next]), nextTime:cuts[ev.next], next:ev.next};
}
function dropToAaa(course,ev){
  if(!ev.time) return null;
  const cuts=DATA.standards[courseKey(course)][ev.event];
  if(!cuts) return null;
  const drop=toSec(ev.time)-toSec(cuts.AAA);
  return {made:drop<=0, drop:Math.max(0,drop)};
}
function el(tag, attrs, kids){
  const n=document.createElement(tag);
  if(attrs){
    for(const [k,v] of Object.entries(attrs)){
      if(v==null||v===false) continue;
      if(k==="class") n.className=v;
      else if(k==="style" && typeof v==="object") Object.assign(n.style,v);
      else if(k.startsWith("on")&&typeof v==="function") n.addEventListener(k.slice(2),v);
      else if(k==="text") n.textContent=v;
      else n.setAttribute(k,v===true?"":v);
    }
  }
  for(const c of (kids||[])){ if(c) n.appendChild(c); }
  return n;
}

let course="SCY";
let lastToast=null;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(lastToast);
  lastToast=setTimeout(()=>t.classList.remove("show"), 4200);
}
function littleElvesWhy(state,event){
  const ev=buildBests(state,"SCY").find(e=>e.event===event);
  if(!ev||!ev.time) return "No SCY time on file";
  if(!ev.windowBest) return "Needs a time that counts for Mid-States";
  const aaa=dropToAaa("SCY",ev);
  const next=dropInfo("SCY",ev);
  if(aaa&&!aaa.made) return fmtDrop(aaa.drop)+" from a Zones AAA";
  if(aaa&&aaa.made) return "Zones AAA in hand";
  if(next) return fmtDrop(next.drop)+" from "+next.next;
  return ev.std?ev.std+" time":"";
}
function previousOf(rows, last){
  const rest=rows.filter(s=>!(s.date===last.date && s.time===last.time));
  return rest.reduce((b,s)=>{
    if(!b) return s;
    if(s.date>b.date) return s;
    if(s.date===b.date && toSec(s.time)<toSec(b.time)) return s;
    return b;
  },null);
}
function lastLine(ev){
  if(!ev.last||!ev.time) return null;
  const last=ev.last;
  const same=last.time===ev.time && last.date===ev.date;
  const n=ev.count||1;
  const unofficial=!!ev.unofficial || (ev.last&&ev.last.provisional);
  const count=n===1?(unofficial?"1 swim on file":"1 official swim"):(unofficial?n+" swims on file":n+" official swims");
  if(same){
    const prev=ev.previous;
    if(prev){
      const off=toSec(prev.time)-toSec(ev.time);
      const sign=off>0?fmtDrop(off)+" slower":fmtDrop(-off)+" faster";
      return {text:"Last swim was her best · "+fmtDate(last.date)+(last.meet?" · "+last.meet:"")+" · Previous "+prev.time+" · "+fmtDate(prev.date)+" · "+sign+" · "+count, kind:"best"};
    }
    return {text:"Last swim was her best · "+fmtDate(last.date)+(last.meet?" · "+last.meet:"")+" · "+count, kind:"best"};
  }
  const off=toSec(last.time)-toSec(ev.time);
  const sign=off>0?fmtDrop(off)+" off best":fmtDrop(-off)+" faster than previous best";
  return {text:"Last "+last.time+" · "+fmtDate(last.date)+(last.meet?" · "+last.meet:"")+" · "+sign+" · "+count, kind:off>0?"off":"best"};
}

function renderEvent(ev, other){
  const d=dropInfo(course,ev);
  const aaa=dropToAaa(course,ev);
  const close=d!=null && d.drop<=0.6;
  const preWindow=course==="SCY" && !!ev.time && !ev.windowBest;
  const hasWindowDiff=course==="SCY" && ev.windowBest && (ev.windowBest.time!==ev.time || ev.windowBest.date!==ev.date);
  const otherStd=other&&other.time?standardFor(other.course,other.event,other.time).std:null;
  const also=other&&other.time ? ("also "+other.time+" "+other.course+(otherStd?", "+otherStd:"")) : ev.time ? ("no "+opposite(course)+" time yet") : "";
  if(!ev.time){
    return el("div",{class:"event empty"},[
      el("div",{class:"ev-name",text:ev.event}),
      el("div",{class:"time-col"},[el("div",{class:"time none",text:"—" })]),
      el("div",{class:"mid"}),
      el("div",{class:"gap"},[el("div",{class:"need",text:"To next cut"}),el("div",{class:"amt",style:{color:"var(--quiet)"},text:"—" })]),
      el("div",{class:"emeta",text:"No "+course+" time yet"})
    ]);
  }
  const mid=[];
  if(course==="SCY"){
    if(preWindow) mid.push(el("span",{class:"tag warn",text:"Mid-States · no window time"}));
    else if(hasWindowDiff){
      const wstd=standardFor("SCY",ev.event,ev.windowBest.time).std;
      mid.push(el("span",{class:"tag ok",text:"Mid-States · window "+ev.windowBest.time+(wstd?" "+wstd:"")}));
    } else mid.push(el("span",{class:"tag ok",text:"Mid-States · in window"}));
  }
  if(aaa&&aaa.made) mid.push(el("span",{class:"tag gold",text:"Zones · AAA in hand"}));
  else if(aaa) mid.push(el("span",{class:"tag quiet",text:"Zones · "+fmtDrop(aaa.drop)+" from AAA"}));

  const metaKids=[];
  if(course==="SCY" && ev.date && !isInWindow(ev.date)){
    metaKids.push(document.createTextNode("Lifetime best · "+fmtDate(ev.date)+(ev.meet?" · "+ev.meet:"")));
    metaKids.push(el("br"));
    if(hasWindowDiff){
      metaKids.push(el("strong",{text:"Window time "+ev.windowBest.time+" · "+fmtDate(ev.windowBest.date)+(ev.windowBest.meet?" · "+ev.windowBest.meet:"")}));
    } else {
      metaKids.push(el("strong",{text:"No Sept 1+ time on file"}));
    }
  } else {
    metaKids.push(document.createTextNode(fmtDate(ev.date)+(ev.meet?" · "+ev.meet:"")));
  }
  if(also){ metaKids.push(document.createTextNode(" · ")); metaKids.push(el("span",{class:"also",text:also})); }

  const last=lastLine(ev);
  const lastEl=last?el("div",{class:"last"},[el("span",{class:last.kind,text:last.text})]):null;

  const r=ev.ranks||{};
  const rankItems=[];
  if(r.ohio) rankItems.push({label:"Ohio",rec:r.ohio,hot:r.ohio.rank<=6});
  if(r.centralZone) rankItems.push({label:"C. Zone",rec:r.centralZone});
  if(r.usa) rankItems.push({label:"USA",rec:r.usa});
  const chips=rankItems.length?el("div",{class:"ranks"}, rankItems.map(it=>el("span",{class:it.hot?"rank hot":"rank"},[
    el("span",{class:"k",text:it.label}), el("span",{class:"v",text:fmtRank(it.rec.rank)}), it.rec.of?el("span",{class:"of",text:fmtOf(it.rec.of)}):null
  ]))):null;
  let ranks=null;
  if(r.pending){
    const kids=[];
    if(chips){
      kids.push(el("span",{class:"rank-cap",text:r.snapshotTime?("Official ranks on "+r.snapshotTime):"Official ranks"}));
      kids.push(chips);
    }
    const provBits=[];
    if(r.provisional && r.fasterBy!=null){
      provBits.push(el("strong",{text:fmtDrop(r.fasterBy)+" faster"}));
      provBits.push(document.createTextNode(r.snapshotTime?(" than "+r.snapshotTime):" than the ranked time"));
      provBits.push(document.createTextNode(" · rank update pending"));
    } else if(r.provisional){
      provBits.push(document.createTextNode("Unofficial · rank update pending"));
    } else {
      provBits.push(document.createTextNode("Rank update pending"));
    }
    kids.push(el("div",{class:"rank-prov",title:"Based on unofficial results, compared with the last official MySwimApp snapshot. A new place is not estimated until official results are in."},provBits));
    ranks=el("div",{class:"ranks-wrap"},kids);
  } else {
    ranks=chips;
  }

  return el("div",{class:preWindow?"event stale":"event"},[
    el("div",{class:"ev-name",text:ev.event}),
    el("div",{class:"time-col"},[
      el("div",{class:"time",text:ev.time}),
      el("div",{class:"badges"},[
        ev.std?el("span",{class:"badge "+ev.std,text:ev.std}):null,
        ev.unofficial?el("span",{class:"unofficial",title:"Based on unofficial results",text:"Unofficial"}):null
      ])
    ]),
    el("div",{class:"mid"},mid),
    el("div",{class:close?"gap close":"gap"}, d?[
      el("div",{class:"need",text:"To next cut"}), el("div",{class:"amt",text:fmtDrop(d.drop)}), el("span",{class:"to",text:"from "+d.next+" · "+d.nextTime})
    ]:[ el("div",{class:"need",text:"To next cut"}), el("div",{class:"amt",text:"AAAA"}), el("span",{class:"to",text:"cut made"}) ]),
    el("div",{class:"emeta"},metaKids),
    lastEl, ranks
  ]);
}

async function onFiles(fileList){
  const files=[...fileList];
  if(!files.length) return;
  let added=0, meets=[];
  const loc=loadLocal();
  const existing=new Set((mergeState().history.concat(mergeState().provisional)).map(swimKey));
  try{
    for(const file of files){
      const parsed=await parseResultsFile(file);
      const newOnes=parsed.swims.filter(s=>!existing.has(swimKey(s)));
      for(const s of newOnes){ loc.history.push(s); existing.add(swimKey(s)); }
      added+=newOnes.length;
      meets.push(parsed.meet+(newOnes.length?(" ("+newOnes.length+" new)"):" (already in this copy)"));
      loc.importedFiles=loc.importedFiles||[];
      loc.importedFiles.push({name:file.name, meet:parsed.meet, addedAt:new Date().toISOString(), swimCount:newOnes.length});
    }
    saveLocal(loc);
    render();
    toast(added?("Added "+added+" swim"+(added===1?"":"s")+" from "+meets.join(", ")+"."):("No new swims. "+meets.join(", ")+" is already in this copy."));
  }catch(err){
    toast(err.message||String(err));
  }
}

function todayET(){

}
function meetPhase(m, today){
  if(m.endDate && m.endDate < today) return "past";
  if(m.startDate && m.endDate && m.startDate <= today && today <= m.endDate) return "current";
  return "upcoming";
}
function parseDeadlineDay(entry){
  if(!entry||!entry.deadline) return null;
  return String(entry.deadline).slice(0,10);
}
function daysUntilET(isoDay, today){
  if(!isoDay||!today) return null;
  const a=new Date(isoDay+"T12:00:00-05:00");
  const b=new Date(today+"T12:00:00-05:00");
  return Math.round((a-b)/86400000);
}
function venueLine(venue){

  if(venue.address && venue.address!==venue.name) bits.push(venue.address);

function renderDeadlineStrip(meets, today){
  const items=[];
  for(const m of meets){
    const entry=m.entry||{};
    const day=parseDeadlineDay(entry);
    const soft=!day && entry.deadlineLabel;
    if(day && day < today) continue;
    if(!day && !soft) continue;
    if(meetPhase(m,today)==="past") continue;
    const days=day?daysUntilET(day,today):null;
    items.push({m, entry, day, soft, days, sort: day||"9999-12-31"});
  }
  items.sort((a,b)=>a.sort<b.sort?-1:a.sort>b.sort?1:0);

    const muted=it.m.poppy&&(it.m.poppy.status==="not_eligible"||it.m.poppy.status==="info_only");
    const cls="deadline"+(it.soft?" soft":"")+(muted?" muted":"");
    const until=it.days==null?null:it.days===0?"Due today":it.days===1?"Due tomorrow":it.days+" days left";
    box.appendChild(el("div",{class:cls},[

  return box;
}

function ehlsValue(v){
  if(v==null || v==="" ) return null;
  const s=String(v).trim();
  if(!s || s.toUpperCase()==="TBA") return null;
  return s;
}
function groupEntries(rows){
  const groups=[];
  let cur=null;
  for(const r of rows||[]){
    const key=(r.date||"")+"|"+(r.session||"");
    if(!cur || cur.key!==key){
      cur={
        key,
        date:r.date,
        dayLabel:r.dayLabel,
        session:r.session,
        sessionDetail:r.sessionDetail,
        warmup:r.warmup,
        start:r.start,
        rows:[]
      };
      groups.push(cur);
    }
    cur.rows.push(r);
  }
  return groups;
}
function entriesHaveTBA(rows){
  return (rows||[]).some(r=>!ehlsValue(r.heat)||!ehlsValue(r.lane));
}
function sessionBand(g){
  const bits=[];
  if(g.dayLabel) bits.push(g.dayLabel);
  if(g.session) bits.push(g.session);
  if(g.warmup) bits.push("Warm-up "+g.warmup);
  if(g.start) bits.push("Start "+g.start);
  if(g.sessionDetail) bits.push(g.sessionDetail);

function notecardFoot(m){

  const src=(m.entriesSource||"").toLowerCase();
  let heatLine;
  if(tba && anyHeat && src.includes("meet mobile")){
    heatLine="Heats and lanes from a Meet Mobile screenshot where listed; otherwise TBA.";
  } else if(tba){
    heatLine="Heat & Lane TBA — no public heat sheet as of "+(DATA.meta.meetsAsOfLabel||"this snapshot")+".";
  } else if(src.includes("meet mobile")){

  return (heatLine+" "+startLine+" Times are unofficial until official results are posted.").trim();
}
function ordinal(n){
  const x=Number(n);
  if(!Number.isFinite(x)) return String(n);
  const v=Math.abs(x)%100, v1=v%10;
  const suf=(v>=11&&v<=13)?"th":v1===1?"st":v1===2?"nd":v1===3?"rd":"th";
  return x+suf;
}

function seasonStart(){
  return (DATA.meta && DATA.meta.midStatesWindowStart) || "2026-09-01";
}
function swimsForMeet(m, state){
  const names=new Set([m.name, m.officialName].filter(Boolean));
  const all=[...(state.history||[]), ...(state.provisional||[])];
  const seen=new Set();
  const hist=[];
  for(const s of all){
    if(!s || !s.meet || !names.has(s.meet) || !s.date || !s.time) continue;
    const k=(s.event||"")+"|"+(s.course||"")+"|"+s.date+"|"+s.time;
    if(seen.has(k)) continue;
    seen.add(k);
    hist.push(s);
  }
  hist.sort((a,b)=>{
    if(a.date!==b.date) return a.date<b.date?-1:1;
    const order=eventOrder(a.course||"SCY");
    return (order.get(a.event)||99)-(order.get(b.event)||99);
  });
  return hist;
}
function eventOrder(course){
  const map=new Map();
  const list=(DATA.eventCatalog && DATA.eventCatalog[courseKey(course)])||[];
  list.forEach((e,i)=>map.set(e.name,i));
  if(!map.has("25 Free")) map.set("25 Free", (map.get("50 Free")||0)+0.5);
  return map;
}
function officialBestRow(event, course){
  return (DATA.officialTimes||[]).find(t=>t.event===event && t.course===course) || null;
}
function windowBestFor(event, course, state){
  const start=seasonStart();
  const rows=[...(state.history||[]), ...(state.provisional||[])].filter(s=>s.event===event && s.course===course && s.date>=start && s.time);
  if(!rows.length) return null;
  return rows.reduce((b,s)=> toSec(s.time)<toSec(b.time)?s:b);
}
function madeStandard(event, course, time){
  const table=DATA.standards && DATA.standards[courseKey(course)];
  const row=table && table[event];
  if(!row || !time) return null;
  const order=["AAAA","AAA","AA","A","BB","B"];
  for(const name of order){
    if(row[name] && toSec(time)<=toSec(row[name])) return name;
  }
  return null;
}
function formatSwimDate(iso){
  if(!iso) return "";
  const [y,mo,da]=iso.split("-").map(Number);
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return (months[mo-1]||"")+" "+da;
}

    const windowRow=windowBestFor(s.event, s.course, state);

    const honor=(DATA.honors||[]).find(h=>h.event===s.event && h.course===s.course && h.time===s.time && h.date===s.date);

  }
  addMeetRow(grid,"Venue", venueLine(m.venue) || el("span",{text:"TBA"}));
  if(m.host) addMeetRow(grid,"Host", el("span",{text:m.host}));
  if(m.eligibility&&m.eligibility.label) addMeetRow(grid,"Eligibility", el("span",{text:m.eligibility.label}));
  const entry=m.entry||{};
  if(entry.maxEventsLabel) addMeetRow(grid,"Event limit", el("span",{text:entry.maxEventsLabel}));
  if(entry.fee) addMeetRow(grid,"Entry fee", el("span",{text:entry.fee}));
  if(entry.deadlineLabel){
    const dl=[el("strong",{text:entry.deadlineLabel})];
    if(entry.hostDeadlineLabel){
      dl.push(document.createTextNode(" · "+entry.hostDeadlineLabel));
    }
    if(entry.signupPath){
      dl.push(document.createTextNode(" · "+entry.signupPath));
    }
    addMeetRow(grid,"Entry deadline", el("span",{},dl));
  }
  if(m.poppy){
    const st=[el("strong",{text:m.poppy.statusLabel||""})];
    const evGroups=m.poppy.events||[];
    if(evGroups.length){
      evGroups.forEach(g=>{
        st.push(el("br"));
        const label=g.session?g.session+": " : "";
        const items=Array.isArray(g.items)?g.items.join(", "):(g.name||"");
        st.push(document.createTextNode(label+items));
      });
    } else if(m.poppy.status==="opted_in_no_events"){
      st.push(document.createTextNode(" Relays are not checked."));
    }
    addMeetRow(grid,"Poppy’s status", el("span",{},st));
  }

  let offered=null;
  if(m.offeredEvents&&m.offeredEvents.length){
    const picks=new Set((m.poppy&&m.poppy.suggestedEvents)||[]);
    offered=el("div",{style:{marginTop:"10px"}},[
      el("div",{class:"k",style:{marginBottom:"4px"},text:"Events offered"}),
      el("ul",{class:"meet-events"}, m.offeredEvents.map(ev=>{
        const li=el("li",{class:picks.has(ev.name)?"pick":""},[
          ev.number?el("span",{class:"num",text:"#"+ev.number}):null,
          el("span",{class:"ev",text:ev.name}),
          ev.seed?el("span",{class:"seed",text:"seed "+ev.seed}):null
        ]);
        return li;
      }))
    ]);
  }

  let suggested=null;
  if(m.poppy&&m.poppy.suggestedEvents&&m.poppy.suggestedEvents.length){
    suggested=el("div",{class:"suggested"},[
      el("div",{class:"lead",text:"Suggested events (for Kevin and her coach to decide)"}),
      el("ul",{}, m.poppy.suggestedEvents.map(name=>el("li",{},[
        el("span",{class:"ev",text:name}),
        el("span",{class:"why",text:littleElvesWhy(state,name)})
      ]))),
      m.poppy.suggestedNote?el("p",{class:"meet-note",text:m.poppy.suggestedNote}):null
    ]);
  }

  const links=el("div",{class:"meet-links"}, (m.links||[]).filter(l=>l&&l.url).map(l=>
    el("a",{href:l.url,target:"_blank",rel:"noopener",text:l.label})
  ));
  const ehls=renderEhlsTable(m);

  const card=el("div",{class:classes.join(" "), id:"meet-"+m.id},[
    head,
    flags.childNodes.length?flags:null,
    grid,
    offered,
    suggested,
    ehls,
    links.childNodes.length?links:null,
    m.notes?el("p",{class:"meet-note",text:m.notes}):null
  ]);
  return card;
}
function renderMeets(root){
  const state=mergeState();
  const today=todayET();
  const meets=Array.isArray(DATA.meets)?DATA.meets.slice():[];
  const upcoming=meets.filter(m=>meetPhase(m,today)!=="past").sort((a,b)=>(a.startDate||"").localeCompare(b.startDate||"")||a.name.localeCompare(b.name));
  const past=meets.filter(m=>meetPhase(m,today)==="past").sort((a,b)=>(b.endDate||"").localeCompare(a.endDate||""));

  const status=el("div",{class:"status"},[el("div",{class:"inner"},[
    el("span",{text:"Meet list as of "+(DATA.meta.meetsAsOfLabel||DATA.meta.snapshotUpdatedLabel)+". Signup is never submitted from this page."}),
    el("span",{class:"fresh",text:"Official bests as of "+DATA.meta.bestTimesAsOfLabel+(DATA.meta.masonMeet&&!DATA.meta.masonMeet.resultsPosted?" · Mason results not posted yet":"")})
  ])]);

  const wrap=el("div",{class:"wrap"});
  const strip=renderDeadlineStrip(meets,today);
  if(strip) wrap.appendChild(strip);
  upcoming.forEach(m=>wrap.appendChild(renderMeetCard(m,today,state)));
  const season=renderSeasonPast(past,state);
  if(season) wrap.appendChild(season);
  const foot=el("p",{class:"meets-foot"});
  foot.appendChild(document.createTextNode("Documents link to public Captyn files when they are available without a login. The "));
  const team=el("a",{href:"https://daytonraiders.captyn.com",target:"_blank",rel:"noopener",text:"Dayton Raiders Captyn site"});
  foot.appendChild(team);
  foot.appendChild(document.createTextNode(" still requires a family login to change declarations. Missing times, fees, or venues are shown as TBA rather than guessed. Band is not monitored from this page — forward anything important that only shows up there."));
  wrap.appendChild(foot);

  root.append(status, wrap);
}


function currentView(){
  return location.hash.replace(/^#/, "") === "meets" ? "meets" : "times";
}
let view = currentView();
function setView(v){
  view = v;
  const hash = "#" + v;
  if (location.hash !== hash) history.replaceState(null, "", hash);
  render();
}
function syncChrome(){
  document.body.dataset.view = view;
  document.querySelectorAll(".view-toggle button").forEach(b => b.setAttribute("aria-pressed", b.getAttribute("data-view") === view ? "true" : "false"));
  document.querySelectorAll("#course-toggle button").forEach(b => b.setAttribute("aria-pressed", b.getAttribute("data-course") === course ? "true" : "false"));
}
function render(){
  view = currentView();
  syncChrome();
  const root = document.getElementById("app");
  root.replaceChildren();
  if (view === "meets") renderMeets(root);
  else renderTimes(root);
}

document.getElementById("btn-scy").addEventListener("click",()=>{course="SCY";render();});
document.getElementById("btn-lcm").addEventListener("click",()=>{course="LCM";render();});
document.getElementById("btn-times").addEventListener("click",()=>setView("times"));
document.getElementById("btn-meets").addEventListener("click",()=>setView("meets"));
window.addEventListener("hashchange",()=>{ const v=currentView(); if(v!==view){ view=v; render(); } });
document.getElementById("btn-import").addEventListener("click",()=>document.getElementById("file").click());
document.getElementById("file").addEventListener("change",e=>{ onFiles(e.target.files); e.target.value=""; });
document.getElementById("btn-unofficial").addEventListener("click",openAddUnofficial);
window.PoppyDash={parseResultsFile,parseHy3,parseCl2,toSec,fmtSec,mergeState,displayMeetName};
render();
tryAutoFetch();

</script>
